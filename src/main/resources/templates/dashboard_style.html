<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/dashboard_style.css" />
</head>

<body>
  <div class="div-body">
    <!-- 헤더 / 보고서 / 국가별 셀렉트 -->
    <div class="row header-row align-items-center">
      <div class="col-3">
        <button class="btn btn-outline-primary">보고서 생성</button>
        <button class="btn btn btn-outline-primary">내보내기</button>
      </div>
      <div class="col-6 header-title">SafeTrack-X</div>
      <div class="col-3 header-btn">
        <button class="btn btn-outline-primary">KOR</button>
        <button class="btn btn-outline-primary">GER</button>
      </div>
    </div>
    <!-- 소제목(1) -->
    <div class="row sub-title1">
      <div class="col-3">
        <h3 class="map-header">Map</h3>
      </div>
      <div class="col-3 map-btn">
        <button class="btn btn-primary btn-sm">도로</button>
        <button class="btn btn-primary btn-sm">가드레일</button>
        <button class="btn btn-primary btn-sm">교통표지판</button>
      </div>
      <div class="col-6 report">
        <h3 class="chart-header">유형별 그래프</h3>
      </div>
    </div>
    <!-- 지도 컨텐츠 & 도넛 차트 -->
    <div class="row map-chart-row">
      <div class="col-6">
        <div class="map" id="map"></div>
      </div>
      <div class="col-3 chart-wrapper">
        <div class="d-chart">
          <h5 class="chart-sub-title">요소별 위험도</h4>
            <canvas id="priorityPieChart"></canvas>
        </div>
      </div>
      <div class="col-3">
        <div class="d-chart">
          <h5 class="chart-sub-title">지역별 위험도</h5>
          <canvas id="regionPieChart"></canvas>
        </div>
      </div>
    </div>
    <!-- 소제목(2) -->
    <div class="row sub-title2">
      <div class="col-6">
        <h3 class="pic-header">Image</h3>
      </div>
      <div class="col-6">
        <h3 class="table-header">지역별 발생현황</h3>
      </div>
    </div>
    <!-- 사진 & 지역별 발생현황 테이블 -->
    <div class="row pic-table-row">
      <div class="col-3">
        <div class="div pic1">
          사진1
        </div>
      </div>
      <div class="col-3">
        <div class="div pic1">
          사진1
        </div>
      </div>
      <div class="col-6">
        <table class="table">
          <thead>
            <tr>
              <th class="th-col">항목</th>
              <th class="th-col">남구</th>
              <th class="th-col">중구</th>
              <th class="th-col">북구</th>
              <th class="th-col">동구</th>
              <th class="th-col">울주군</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="table-primary">crack</td>
              <td><span class="crack">12건</span></td>
              <td><span class="crack">10건</span></td>
              <td><span class="crack">2건</span></td>
              <td><span class="crack">8건</span></td>
              <td><span class="crack">0건</span></td>
            </tr>
            <tr>
              <td class="table-primary">pothole</td>
              <td><span class="pothole">12건</span></td>
              <td><span class="pothole">10건</span></td>
              <td><span class="pothole">2건</span></td>
              <td><span class="pothole">8건</span></td>
              <td><span class="pothole">0건</span></td>
            </tr>
            <tr>
              <td class="table-primary">rust</td>
              <td><span class="rust">12건</span></td>
              <td><span class="rust">10건</span></td>
              <td><span class="rust">2건</span></td>
              <td><span class="rust">8건</span></td>
              <td><span class="rust">0건</span></td>
            </tr>
            <tr>
              <td class="table-primary">breakage</td>
              <td><span class="breakage">12건</span></td>
              <td><span class="breakage">10건</span></td>
              <td><span class="breakage">2건</span></td>
              <td><span class="breakage">8건</span></td>
              <td><span class="breakage">0건</span></td>
            </tr>
            <tr>
              <td class="table-primary">rust_volt</td>
              <td><span class="rust_volt">12건</span></td>
              <td><span class="rust_volt">10건</span></td>
              <td><span class="rust_volt">2건</span></td>
              <td><span class="rust_volt">8건</span></td>
              <td><span class="rust_volt">0건</span></td>
            </tr>
            <tr>
              <td class="table-primary">empty_volt</td>
              <td><span class="empty_volt">12건</span></td>
              <td><span class="empty_volt">10건</span></td>
              <td><span class="empty_volt">2건</span></td>
              <td><span class="empty_volt">8건</span></td>
              <td><span class="empty_volt">0건</span></td>
            </tr>
            <tr>
              <td class="table-primary">asd</td>
              <td><span class="empty_volt">12건</span></td>
              <td><span class="empty_volt">10건</span></td>
              <td><span class="empty_volt">2건</span></td>
              <td><span class="empty_volt">8건</span></td>
              <td><span class="empty_volt">0건</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <!-- 추이 그래프 -->
    <div class="row sub-title3">
      <div class="col">
        <h3 class="chui-header">변화 추이</h3>
      </div>
    </div>
    <div class="row chui-row">
      <div class="col">
        <canvas id="myChart"></canvas>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.1.4/Chart.min.js"></script>
  <script type="text/javascript"
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=e9951f313d7c93e67219e06f9463c1a4&libraries=services"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="/dashboard_style.js"></script>
</body>

</html>
