<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/dashboard_style.css" />
</head>

<body>
  <div>
    <!-- 헤더 / 보고서 / 국가별 셀렉트 -->
    <div class="row header-row align-items-center">
      <div class="col-3">
        <button class="btn btn-outline-primary" id="btn-report">보고서 생성</button>
        <button class="btn btn btn-outline-primary" id="btn-report">내보내기</button>
      </div>
      <div class="col-6 header-title">SafeTrack-X</div>
      <div class="col-3 header-btn">
        <input type="radio" class="btn-check" name="local-options" id="local-option1" autocomplete="off" checked>
        <label class="btn btn-primary" for="local-option1" id="btn-Nationality">KOR</label>
        <input type="radio" class="btn-check" name="local-options" id="local-option2" autocomplete="off">
        <label class="btn btn-primary" for="local-option2" id="btn-Nationality" onclick="dataCollection()">GER</label>
        <!-- <button class="btn btn-outline-primary">KOR</button>
        <button class="btn btn-outline-primary">GER</button> -->
      </div>
    </div>
    <!-- 소제목(1) -->
    <div class="row sub-title1">
      <div class="col-3">
        <h3 class="map-header">Map</h3>
      </div>
      <div class="col-3 map-btn">
        <input type="radio" class="btn-check" name="options" id="option1" autocomplete="off" onclick="removeMarker('road')" checked>
        <label class="btn btn-primary btn-sm" for="option1" id="btn-radio">도 로</label>
        <input type="radio" class="btn-check" name="options" id="option2" autocomplete="off" onclick="removeMarker('guard')">
        <label class="btn btn-primary btn-sm " for="option2" id="btn-radio">가드레일</label>
        <input type="radio" class="btn-check" name="options" id="option3" autocomplete="off" onclick="removeMarker('panel')">
        <label class="btn btn-primary btn-sm" for="option3" id="btn-radio">교통표지판</label>
      </div>
      <div class="col-6">
        <h3 class="chart-header">유형별 그래프</h3>
      </div>
    </div>
    <!-- 지도 컨텐츠 & 도넛 차트 -->
    <div class="row map-chart-row">
      <div class="col-6">
        <div class="map" id="map"></div>
      </div>
      <div class="col-3">
        <div class="d-chart">
          <h5 class="chart-sub-title">요소별 위험도</h4>
            <canvas id="priorityPieChart"></canvas>
        </div>
      </div>
      <div class="col-3">
        <div class="d-chart">
          <h5 class="chart-sub-title">지역별 위험도</h5>
          <canvas id="regionPieChart"></canvas>
        </div>
      </div>
    </div>
    <!-- 소제목(2) -->
    <div class="row sub-title2">
      <div class="col-6">
        <h3 class="pic-header">Image</h3>
      </div>
      <div class="col-6">
        <h3 class="table-header">지역별 발생현황</h3>
      </div>
    </div>
    <!-- 사진 & 지역별 발생현황 테이블 -->
    <div class="row pic-table-row">
      <div class="col-3 pic-col">
        <div class="pic1">
          사진1
        </div>
      </div>
      <div class="col-3 pic-col">
        <div class="pic1">
          사진1
        </div>
      </div>
      <div class="col pic-col">
        <table class="table">
          <colgroup>
            <col width="25%">
            <col width="15%">
            <col width="15%">
            <col width="15%">
            <col width="15%">
            <col width="15%">
          </colgroup>
          <thead>
            <tr>
              <th class="th-col">항목</th>
              <th class="th-col">남구</th>
              <th class="th-col">동구</th>
              <th class="th-col">중구</th>
              <th class="th-col">북구</th>
              <th class="th-col">울주군</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="table-primary">Crack</td>
              <td><span class="crack" id="namguCrack"></span></td>
              <td><span class="crack" id="dongguCrack"></span></td>
              <td><span class="crack" id="joongguCrack"></span></td>
              <td><span class="crack" id="bookguCrack"></span></td>
              <td><span class="crack" id="uljooCrack"></span></td>
            </tr>
            <tr>
              <td class="table-primary">Pothole</td>
              <td><span class="pothole" id="namguPothole"></span></td>
              <td><span class="pothole" id="dongguPothole"></span></td>
              <td><span class="pothole" id="joongguPothole"></span></td>
              <td><span class="pothole" id="bookguPothole"></span></td>
              <td><span class="pothole" id="uljooPothole"></span></td>
            </tr>
            <tr>
              <td class="table-primary">Rust</td>
              <td><span class="rust" id="namguRust"></span></td>
              <td><span class="rust" id="dongguRust"></span></td>
              <td><span class="rust" id="joongguRust"></span></td>
              <td><span class="rust" id="bookguRust"></span></td>
              <td><span class="rust" id="uljooRust"></span></td>
            </tr>
            <tr>
              <td class="table-primary">Breakage</td>
              <td><span class="breakage" id="namguBreakage"></span></td>
              <td><span class="breakage" id="dongguBreakage"></span></td>
              <td><span class="breakage" id="joongguBreakage"></span></td>
              <td><span class="breakage" id="bookguBreakage"></span></td>
              <td><span class="breakage" id="uljooBreakage"></span></td>
            </tr>
            <tr>
              <td class="table-primary">Damaged Panel</td>
              <td><span class="demaged_panal" id="namguDamagedPanel"></span></td>
              <td><span class="demaged_panal" id="dongguDamagedPanel"></span></td>
              <td><span class="demaged_panal" id="joongguDamagedPanel"></span></td>
              <td><span class="demaged_panal" id="bookguDamagedPanel"></span></td>
              <td><span class="demaged_panal" id="uljooDamagedPanel"></span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <!-- 추이 그래프 -->
    <div class="row sub-title3">
      <div class="col">
        <h3 class="chui-header">변화 추이</h3>
      </div>
    </div>
    <div class="row chui-row">
      <div class="col">
        <canvas id="myChart"></canvas>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.1.4/Chart.min.js"></script>
  <script type="text/javascript"
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=e9951f313d7c93e67219e06f9463c1a4&libraries=services"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="/js/dashboard_style.js"></script>
</body>

</html>
